name: Deploy Draft Sim to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Draft Brain Meta"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check planner.js
          node --check live.js
          node --check shared-data.js
          node --check stats-engine.js
          node --check advanced-engine.js
          node --check draft-ai.js
          node --check champion-picker.js
          node --check scouting-lineup.js
          node --check brain-opponent.js
          node --check team-roster.js
          node --check team-data.js
          node --check roster-model.js
          node --check champs.js
          node --check groq-coach.js
          node --check postmatch.js
          node tests/brain-regression.cjs
          node tests/groq-policy.cjs
          node tests/postmatch.cjs
          node tests/planner-review.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
