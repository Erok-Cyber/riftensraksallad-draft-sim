name: Refresh Riot draft stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Gold/Plat Riot stats snapshot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_PLATFORM: euw1
          RIOT_REGION: europe
          RIOT_STATS_DAYS: "21"
        run: python scripts/build_riot_stats.py

      - name: Commit refreshed stats
        run: |
          if git diff --quiet -- riot-stats.json; then
            echo "No stats change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add riot-stats.json
          git commit -m "Refresh Riot draft statistics"
          git push
